name: Build Android 16 SMS Archiver APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK 36 Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/smsfilterarchiver

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmsFilterArchiver"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.smsfilterarchiver"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.example.smsfilterarchiver"
                  minSdk = 34
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation(platform("androidx.compose:compose-bom:2025.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.WRITE_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.SEND_SMS" />

              <application
                  android:allowBackup="true"
                  android:label="SMS Filter Archiver"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <action android:name="android.intent.action.SENDTO" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="sms" />
                          <data android:scheme="smsto" />
                          <data android:scheme="mms" />
                          <data android:scheme="mmsto" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".SmsReceiverStub"
                      android:exported="true"
                      android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.SMS_DELIVER" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".MmsReceiverStub"
                      android:exported="true"
                      android:permission="android.permission.BROADCAST_WAP_PUSH">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.WAP_PUSH_DELIVER" />
                          <data android:mimeType="application/vnd.wap.mms-message" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".HeadlessSmsSendServiceStub"
                      android:exported="true"
                      android:permission="android.permission.SEND_RESPOND_VIA_MESSAGE">
                      <intent-filter>
                          <action android:name="android.intent.action.RESPOND_VIA_MESSAGE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="sms" />
                          <data android:scheme="smsto" />
                          <data android:scheme="mms" />
                          <data android:scheme="mmsto" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/smsfilterarchiver/MainActivity.kt
          package com.example.smsfilterarchiver

          import android.Manifest
          import android.app.Service
          import android.app.role.RoleManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.IBinder
          import android.provider.Telephony
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.*

          data class SmsItem(
              val id: Long,
              val address: String,
              val body: String,
              val date: Long
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              SmsFilterScreen(context = this)
                          }
                      }
                  }
              }
          }

          @Composable
          fun SmsFilterScreen(context: Context) {
              var keywordsInput by remember { mutableStateOf("OTP, verification, code, passcode") }
              var matchedMessages by remember { mutableStateOf(listOf<SmsItem>()) }
              var statusText by remember { mutableStateOf("Ready. Enter keywords and scan.") }

              val roleManager = remember { context.getSystemService(RoleManager::class.java) }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  statusText = if (granted) {
                      "READ_SMS permission granted! Tap '1. Scan SMS'."
                  } else {
                      "Permission denied. Enable 'Allow restricted settings' in App Info."
                  }
              }

              val roleLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) {
                  val isDefault = roleManager?.isRoleHeld(RoleManager.ROLE_SMS) == true
                  statusText = if (isDefault) {
                      "App is now Default SMS handler. You can now delete messages."
                  } else {
                      "Default SMS role not granted. Deletion requires Default SMS role."
                  }
              }

              val exportTxtLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.CreateDocument("text/plain")
              ) { uri: Uri? ->
                  if (uri != null) {
                      val exportedCount = writeMessagesToTxt(context, uri, matchedMessages)
                      val deletedCount = deleteMatchedSms(context, matchedMessages)
                      statusText = if (deletedCount > 0) {
                          "Exported $exportedCount messages to .txt and deleted $deletedCount from SMS!"
                      } else {
                          "Exported $exportedCount messages to .txt. (0 deleted - tap '2. Enable Delete Role' first)."
                      }
                      if (deletedCount > 0) {
                          matchedMessages = emptyList()
                      }
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .statusBarsPadding()
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text(
                      text = "SMS Keyword Filter & Archiver",
                      style = MaterialTheme.typography.headlineSmall
                  )

                  OutlinedTextField(
                      value = keywordsInput,
                      onValueChange = { keywordsInput = it },
                      label = { Text("Keywords (comma-separated)") },
                      modifier = Modifier.fillMaxWidth()
                  )

                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(
                          onClick = {
                              if (ContextCompat.checkSelfPermission(
                                      context,
                                      Manifest.permission.READ_SMS
                                  ) != PackageManager.PERMISSION_GRANTED
                              ) {
                                  permissionLauncher.launch(Manifest.permission.READ_SMS)
                              } else {
                                  val keywords = keywordsInput.split(",")
                                      .map { it.trim() }
                                      .filter { it.isNotEmpty() }
                                  matchedMessages = queryMatchingSms(context, keywords)
                                  statusText = "Found ${matchedMessages.size} matching messages."
                              }
                          },
                          modifier = Modifier.weight(1f)
                      ) {
                          Text("1. Scan SMS")
                      }

                      OutlinedButton(
                          onClick = {
                              if (roleManager != null && roleManager.isRoleAvailable(RoleManager.ROLE_SMS)) {
                                  if (!roleManager.isRoleHeld(RoleManager.ROLE_SMS)) {
                                      val intent = roleManager.createRequestRoleIntent(RoleManager.ROLE_SMS)
                                      roleLauncher.launch(intent)
                                  } else {
                                      Toast.makeText(
                                          context,
                                          "Already set as Default SMS app!",
                                          Toast.LENGTH_SHORT
                                      ).show()
                                  }
                              }
                          },
                          modifier = Modifier.weight(1f)
                      ) {
                          Text("2. Enable Delete Role")
                      }
                  }

                  Button(
                      onClick = {
                          if (matchedMessages.isNotEmpty()) {
                              val timestamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(Date())
                              exportTxtLauncher.launch("Filtered_SMS_$timestamp.txt")
                          }
                      },
                      enabled = matchedMessages.isNotEmpty(),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("3. Export to .TXT & Delete (${matchedMessages.size})")
                  }

                  Text(
                      text = statusText,
                      style = MaterialTheme.typography.bodyMedium,
                      color = MaterialTheme.colorScheme.primary
                  )

                  HorizontalDivider()

                  LazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      items(matchedMessages, key = { it.id }) { sms ->
                          Card(modifier = Modifier.fillMaxWidth()) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Text(
                                      text = "From: ${sms.address}",
                                      style = MaterialTheme.typography.titleSmall
                                  )
                                  Text(
                                      text = SimpleDateFormat("dd MMM yyyy, hh:mm a", Locale.getDefault())
                                          .format(Date(sms.date)),
                                      style = MaterialTheme.typography.labelSmall
                                  )
                                  Spacer(modifier = Modifier.height(4.dp))
                                  Text(
                                      text = sms.body,
                                      style = MaterialTheme.typography.bodySmall
                                  )
                              }
                          }
                      }
                  }
              }
          }

          fun queryMatchingSms(context: Context, keywords: List<String>): List<SmsItem> {
              if (keywords.isEmpty()) return emptyList()
              val results = mutableListOf<SmsItem>()
              val projection = arrayOf(
                  Telephony.Sms._ID,
                  Telephony.Sms.ADDRESS,
                  Telephony.Sms.BODY,
                  Telephony.Sms.DATE
              )

              context.contentResolver.query(
                  Telephony.Sms.CONTENT_URI,
                  projection,
                  null,
                  null,
                  "${Telephony.Sms.DATE} DESC"
              )?.use { cursor ->
                  val idCol = cursor.getColumnIndexOrThrow(Telephony.Sms._ID)
                  val addrCol = cursor.getColumnIndexOrThrow(Telephony.Sms.ADDRESS)
                  val bodyCol = cursor.getColumnIndexOrThrow(Telephony.Sms.BODY)
                  val dateCol = cursor.getColumnIndexOrThrow(Telephony.Sms.DATE)

                  while (cursor.moveToNext()) {
                      val body = cursor.getString(bodyCol) ?: ""
                      if (keywords.any { kw -> body.contains(kw, ignoreCase = true) }) {
                          results.add(
                              SmsItem(
                                  id = cursor.getLong(idCol),
                                  address = cursor.getString(addrCol) ?: "Unknown",
                                  body = body,
                                  date = cursor.getLong(dateCol)
                              )
                          )
                      }
                  }
              }
              return results
          }

          fun writeMessagesToTxt(context: Context, uri: Uri, messages: List<SmsItem>): Int {
              val dateFormat = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault())
              return try {
                  context.contentResolver.openOutputStream(uri)?.bufferedWriter()?.use { writer ->
                      writer.write("=== Archived SMS Messages (${messages.size}) ===\n\n")
                      for (sms in messages) {
                          val formattedDate = dateFormat.format(Date(sms.date))
                          writer.write("ID: ${sms.id} | From: ${sms.address} | Date: $formattedDate\n")
                          writer.write("Message: ${sms.body}\n")
                          writer.write("--------------------------------------------------\n")
                      }
                  }
                  messages.size
              } catch (e: Exception) {
                  e.printStackTrace()
                  0
              }
          }

          fun deleteMatchedSms(context: Context, messages: List<SmsItem>): Int {
              val roleManager = context.getSystemService(RoleManager::class.java)
              if (roleManager?.isRoleHeld(RoleManager.ROLE_SMS) != true) {
                  return 0
              }

              var deletedTotal = 0
              for (sms in messages) {
                  val uri = Uri.withAppendedPath(Telephony.Sms.CONTENT_URI, sms.id.toString())
                  deletedTotal += context.contentResolver.delete(uri, null, null)
              }
              return deletedTotal
          }

          class SmsReceiverStub : BroadcastReceiver() {
              override fun onReceive(context: Context?, intent: Intent?) {}
          }

          class MmsReceiverStub : BroadcastReceiver() {
              override fun onReceive(context: Context?, intent: Intent?) {}
          }

          class HeadlessSmsSendServiceStub : Service() {
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Filter-Archiver-APK
          path: app/build/outputs/apk/debug/app-debug.apk
